<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuwait GPS Location Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
            font-size: 14px;
            line-height: 1.7;
        }
        .highlight {
            font-weight: bold;
            color: #1a252f;
        }
        .map-btn {
            display: inline-block;
            margin-top: 12px;
            background: #007bff;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📍 লাইভ GPS লোকেশন চেকার</h2>
    <p>আপনার বর্তমান সঠিক অবস্থান ও এলাকা দেখতে নিচের বাটনে চাপুন:</p>
    <button onclick="getLocation()">লোকেশন চেক করুন</button>
    
    <div id="output" class="result" style="display:none;"></div>
</div>

<script>
function getLocation() {
    const output = document.getElementById("output");
    output.style.display = "block";
    output.innerHTML = "⏳ আপনার ফোনের GPS স্যাটেলাইট থেকে তথ্য নেওয়া হচ্ছে...";

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        });
    } else {
        output.innerHTML = "❌ আপনার ব্রাউজার GPS সাপোর্ট করে না।";
    }
}

function showPosition(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const accuracy = Math.round(position.coords.accuracy);
    const output = document.getElementById("output");

    // ব্রাউজার-ফ্রেন্ডলি Reverse Geocoding API (কোনো ব্লক ছাড়াই কাজ করে)
    fetch(`https://bigdatacloud.net{lat}&longitude=${lon}&localityLanguage=en`)
        .then(response => response.json())
        .then(data => {
            const area = data.locality || data.city || "অজানা এলাকা";
            const governorate = data.principalSubdivision || "Kuwait";
            const country = data.countryName || "";

            output.innerHTML = `
                <span class="highlight">📌 এলাকা (Area):</span> ${area}, ${governorate}<br>
                <span class="highlight">🌍 দেশ:</span> ${country}<br>
                <span class="highlight">🧭 Latitude:</span> ${lat.toFixed(6)}<br>
                <span class="highlight">🧭 Longitude:</span> ${lon.toFixed(6)}<br>
                <span class="highlight">🎯 Accuracy:</span> ${accuracy} মিটার<br>
                <a class="map-btn" href="https://google.com{lat},${lon}" target="_blank">🗺️ Google Maps-এ সঠিক পিন দেখুন</a>
            `;
        })
        .catch(() => {
            output.innerHTML = `
                <span class="highlight">🧭 Latitude:</span> ${lat.toFixed(6)}<br>
                <span class="highlight">🧭 Longitude:</span> ${lon.toFixed(6)}<br>
                <span class="highlight">🎯 Accuracy:</span> ${accuracy} মিটার<br>
                <a class="map-btn" href="https://google.com{lat},${lon}" target="_blank">🗺️ Google Maps-এ লোকেশন দেখুন</a>
            `;
        });
}

function showError(error) {
    const output = document.getElementById("output");
    switch(error.code) {
        case error.PERMISSION_DENIED:
            output.innerHTML = "❌ লোকেশন পারমিশন ব্লক করা আছে। ব্রাউজারের সেটিংস থেকে Location Allow করুন।";
            break;
        case error.POSITION_UNAVAILABLE:
            output.innerHTML = "❌ ফোনের GPS সিগন্যাল পাওয়া যাচ্ছে না। ফোনের Location চালু আছে কি না দেখুন।";
            break;
        case error.TIMEOUT:
            output.innerHTML = "⏳ সিগন্যাল পেতে দেরি হচ্ছে। খোলা জায়গায় এসে আবার চেষ্টা করুন।";
            break;
        default:
            output.innerHTML = "❌ লোকেশন বের করতে সমস্যা হচ্ছে।";
    }
}
</script>

</body>
</html>
